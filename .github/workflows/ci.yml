name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  debian:
    runs-on: ubuntu-22.04
    container: rust:1.85-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian 12 build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends clang llvm libbpf-dev libelf-dev zlib1g-dev python3 make
      - name: Build
        run: make all
      - name: Tests
        run: make test
      - name: Gate integration
        run: |
          python3 tests/gate_integration.py --binary gate/target/release/xddp-gate
          python3 tests/gate_integration.py --binary gate/target/release/xddp-gate --proxy-v2
      - name: Script syntax
        run: |
          for file in scripts/*.sh scripts/ddosctl; do sh -n "$file"; done
          python3 -m compileall -q controller scripts tests
      - name: State layout evidence
        run: gate/target/release/xddp-gate --state-sizes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debian-build
          path: |
            gate/Cargo.lock
            build/xdp_ddos.bpf.o
            build/xdp_pass.bpf.o
            build/xddp-loader
            gate/target/release/xddp-gate
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel test dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libbpf-dev libelf-dev zlib1g-dev
      - run: make xdp
      - name: Load and execute XDP fixtures
        run: |
          mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf
          sudo env XDDP_BPF_TEST=1 python3 -m unittest discover -s tests -p test_xdp.py -v
      - name: Isolated netns native attachment and PMTU
        run: sudo sh scripts/netns_test.sh
