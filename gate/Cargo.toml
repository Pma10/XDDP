[package]
name = "xddp-gate"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ipnet = { version = "2.11", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.43", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
